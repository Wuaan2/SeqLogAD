# P2.3 lightweight Sequence expert (preregistered before any run; see implementation_contract).
# Every data, prompt, context, objective, validation and checkpoint-selection field is
# inherited unchanged from the P2.2 reference config; only the keys below differ.
sequence_lightweight:
  id: LIGHT-SEQ-001
  version: '1.0'
  expert_id: SEQUENCE_LIGHTWEIGHT
  inherits: configs/models/sequence-reference-v13r1.yaml
  implementation_contract: docs/protocol/P2.3-lightweight-sequence-expert.md
  architecture:
    family: CAUSAL_TRANSFORMER_FROM_SCRATCH
    blocks: LLAMA_DECODER  # RMSNorm, RoPE, SwiGLU; random init
    pretrained_weights: false
    vocab_size: 128256  # Llama-3.1 tokenizer, shared with P2.2
    hidden_size: 256
    intermediate_size: 1024
    num_hidden_layers: 4
    num_attention_heads: 4
    num_key_value_heads: 4
    rope_theta: 500000.0
    tie_word_embeddings: true
  # A randomly initialised model needs a larger step size and more updates than a LoRA.
  learning_rate: 0.0005
  max_steps: 3072
  warmup_steps: 200
  resource_criterion:
    reference_total_parameters: 8030261248  # Llama-3.1-8B
    max_total_parameter_fraction: 0.01
    reported: [total_parameters, trainable_parameters, runtime_seconds, peak_vram_allocated,
               peak_vram_reserved, validation_seconds_per_window]
  capability_comparison: SOURCE_DEVELOPMENT_MACRO_F1_VS_REFERENCE_REPORTED_WITHOUT_PASS_THRESHOLD
